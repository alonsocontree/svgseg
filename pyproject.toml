[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svgseg"
version = "0.1.0"
description = "Vectorize raster logos into SVG where every piece is an editable path"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Alonso Contreras", email = "alonso@bitsied.com" }]
keywords = ["svg", "vector", "vectorizer", "raster", "logo", "potrace", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-image>=0.25",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "lxml>=5.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/alonsocontree/svgseg"
Repository = "https://github.com/alonsocontree/svgseg"
Issues = "https://github.com/alonsocontree/svgseg/issues"

[project.scripts]
svgseg = "svgseg.cli:main"
svgseg-gui = "svgseg.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["svgseg"]
# Compiled translations must ship inside the wheel or the GUI has nothing to load.
artifacts = ["svgseg/gui/translations/*.qm"]

[tool.hatch.build.targets.sdist]
include = [
    "svgseg",
    "tests",
    "examples",
    "docs",
    "bench",
    "packaging", # The PyInstaller spec, so the Windows build is reproducible.
    "README.md",
    "LICENSE",
]
artifacts = ["svgseg/gui/translations/*.qm"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]
ignore = [
    # Single-letter names are the clearest option for matrices and coordinates
    # in the geometry and quantization code.
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# The bench scripts run standalone and adjust sys.path before importing.
"bench/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
